name: Publicar anúncio CP Auto na Meta
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meta-cp-auto-crefaz-sp
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Criar e ativar a campanha CP Auto
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python3 ads/cp-auto/publicar.py
