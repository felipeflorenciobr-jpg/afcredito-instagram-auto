name: Adicionar Stories e Reels ao anúncio CP Auto
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meta-cp-auto-crefaz-sp
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Aplicar formatos ao mesmo anúncio e conjunto
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python3 ads/cp-auto/posicionamentos.py
