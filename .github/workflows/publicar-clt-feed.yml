name: Publicação pontual — Feed CLT
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check prepara e valida; publish publica no feed'
        type: choice
        options: [check, publish]
        default: check
        required: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: feed-clt-publicacao-pontual
  cancel-in-progress: false
jobs:
  publicar:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Preparar arte quadrada em JPEG
        run: |
          python - <<'PY'
          from PIL import Image
          src='docs/media/clt-feed-2026-11-03.png'
          dst='docs/media/clt-feed-2026-11-03.jpg'
          im=Image.open(src).convert('RGB')
          im=im.resize((1080,1080),Image.Resampling.LANCZOS)
          im.save(dst,'JPEG',quality=91,optimize=True)
          print('FEED_JPEG_PRONTO',im.size)
          PY
      - name: Salvar JPEG em GitHub
        run: |
          git config user.name 'AF Crédito Automação'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/media/clt-feed-2026-11-03.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Adicionar JPEG quadrado CLT para publicação'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - uses: actions/deploy-pages@v4
      - name: Validar ou publicar na Meta
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_API_VERSION: v26.0
          MODE: ${{ inputs.mode }}
        run: python publicar_clt_feed.py --mode "$MODE"
      - name: Gravar confirmação mesmo se houver erro posterior
        if: always()
        run: |
          if [ -f docs/clt-feed-2026-11-03-published.json ]; then
            git config user.name 'AF Crédito Automação'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add docs/clt-feed-2026-11-03-published.json
            if ! git diff --cached --quiet; then
              git commit -m 'Registrar publicação pontual de Crédito CLT no feed'
              git push
            fi
          fi
