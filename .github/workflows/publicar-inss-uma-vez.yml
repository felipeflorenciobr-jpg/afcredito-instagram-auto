name: Publicacao pontual INSS — feed e story
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check apenas valida; publish publica feed e story uma vez'
        type: choice
        options: [check, publish]
        default: check
        required: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: inss-publicacao-pontual
  cancel-in-progress: false
jobs:
  publicar:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - uses: actions/deploy-pages@v4
      - name: Validar ou publicar INSS
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_API_VERSION: v26.0
          MODE: ${{ inputs.mode }}
        run: python publicar_inss_uma_vez.py --mode "$MODE"
      - name: Registrar IDs publicados
        if: always()
        run: |
          if [ -f docs/inss-2026-11-03-publicacoes.json ]; then
            git config user.name 'AF Crédito Automação'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add docs/inss-2026-11-03-publicacoes.json
            if ! git diff --cached --quiet; then
              git commit -m 'Registrar publicações pontuais de INSS'
              git pull --rebase
              git push
            fi
          fi
